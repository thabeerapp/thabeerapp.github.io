<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ثبير | Thabeer</title>
  <meta name="description" content="ثبير دليلكم الذكي للتعلم والتدريب المستمر. منصة للربط بين الطلاب والمعلمين والمراكز التدريبية في المملكة العربية السعودية.">

    :root {
      --paper: #fcfbfe;
      --ink: #1a0826;
      --purple-dark: #2e003e;
      --purple-main: #4a0e4e;
      --purple-light: #6a1b6e;
      --muted: #5a4b62;
      --line: #e2d7e5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "IBM Plex Sans Arabic", sans-serif;
      line-height: 1.5;
    }

    main { min-height: 100vh; }

    .hero {
      background-color: var(--purple-dark);
      padding: 4rem 1.5rem;
      text-align: center;
      color: #ffffff;
    }

    .hero-title {
      font-size: 2.25rem;
      font-weight: 700;
    }

    .poem {
      padding: 3.5rem 1.5rem;
      text-align: center;
    }

    .poem p {
      max-width: 48rem;
      margin: 0 auto;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--purple-dark);
    }

    .tagline-grid {
      background-color: var(--purple-dark);
      padding: 3.5rem 1.5rem;
      text-align: center;
      color: #ffffff;
    }

    .tagline-ar {
      font-size: 1.35rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .tagline-en {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .soon {
      padding: 3.5rem 1.5rem;
      text-align: center;
    }

    .soon h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--purple-dark);
    }

    .soon p {
      color: var(--muted);
      margin-top: 0.5rem;
      font-size: 0.95rem;
    }

    .badges {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 16rem;
      padding: 0.75rem 1rem;
      border: 1px solid var(--purple-main);
      background: #ffffff;
      border-radius: 8px;
    }

    .badge-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      background: var(--purple-dark);
      color: #ffffff;
      border-radius: 6px;
    }

    .badge-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .badge-soon {
      font-size: 0.75rem;
      color: var(--purple-light);
    }

    .badge-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
    }

    .services {
      max-width: 64rem;
      margin: 0 auto;
      padding: 0 1.5rem 4rem;
    }

    .services h2 {
      margin-bottom: 2rem;
      text-align: center;
      font-size: 1.75rem;
      color: var(--purple-dark);
      font-weight: 700;
    }

    .cards {
      display: grid;
      gap: 1rem;
    }

    .card {
      padding: 1.5rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #ffffff;
      text-align: center;
    }

    .strong {
      font-weight: 700;
      color: var(--purple-dark);
      display: block;
      margin-bottom: 0.4rem;
      font-size: 1.1rem;
    }
