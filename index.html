:root {
  --paper: #faf7f4;
  --ink: #1c1917;
  --orange: #e07428;
  --orange-deep: #a9591d;
  --muted: #6f6760;
  --line: #e6dfd6;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
  text-wrap: pretty;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

h1, h2 { text-wrap: balance; font-weight: 500; }

a:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }

main { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Hero */
.hero {
  height: 16rem;
  background:
    linear-gradient(rgba(28,25,23,.2), rgba(28,25,23,.2)),
    linear-gradient(rgba(224,116,40,.45), rgba(224,116,40,.45)),
    url("images/light.jpg") center / cover no-repeat var(--orange-deep);
  display: flex; align-items: center; justify-content: center; padding: 0 1.5rem;
}
.hero-title {
  text-align: center; font-size: 2rem; letter-spacing: 0.025em; color: #ffffff; font-weight: 700;
}

/* Intro */
.poem { padding: 3.5rem 1.5rem; }
.poem p {
  max-width: 48rem; margin: 0 auto; text-align: center;
  font-size: 1.5rem; font-weight: 500; line-height: 1.9; color: var(--orange);
}
.poem .intro { margin-top: 1.75rem; font-size: 1rem; font-weight: 400; line-height: 1.7; color: var(--muted); }

/* Tagline */
.tagline-grid {
  display: grid; gap: 2rem; padding: 3.5rem 1.5rem;
  background:
    linear-gradient(rgba(28,25,23,.25), rgba(28,25,23,.25)),
    linear-gradient(rgba(224,116,40,.5), rgba(224,116,40,.5)),
    url("images/light.jpg") center / cover no-repeat var(--orange-deep);
}
.tagline-ar, .tagline-en {
  font-size: 1.35rem; font-weight: 600; color: #ffffff; text-align: center;
}
.tagline-ar { line-height: 1.4; }
.tagline-en { line-height: 1.3; letter-spacing: 0.025em; }

/* Coming soon */
.soon { padding: 3.5rem 1.5rem; text-align: center; }
.soon h2 { font-size: 1.5rem; font-weight: 600; color: var(--orange); }
.soon .muted { margin-top: 0.5rem; font-size: 0.95rem; }
.badges {
  margin-top: 2rem; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1rem;
}
.badge {
  display: flex; align-items: center; justify-content: center; gap: 0.75rem;
  min-height: 4rem; min-width: 16rem; padding: 0.75rem 1rem;
  border: 1px solid var(--orange); background: var(--paper);
  border-radius: 8px;
}
.badge-icon {
  display: flex; flex-shrink: 0; align-items: center; justify-content: center;
  width: 2.5rem; height: 2.5rem; background: var(--ink); color: var(--paper);
  border-radius: 6px;
}
.badge-text { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.25; }
.badge-soon { font-size: 0.75rem; font-weight: 500; color: var(--orange-deep); }
.badge-name { font-size: 1rem; font-weight: 600; color: var(--ink); }

/* Facts */
.facts { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem 3rem; }
.fact { border-bottom: 1px solid var(--line); padding: 1.75rem 0; text-align: center; }
.fact h2 { margin-bottom: 0.5rem; font-size: 1.15rem; font-weight: 600; color: var(--orange); }
.fact p { max-width: 28rem; margin: 0 auto; line-height: 1.625; }
.mail {
  display: inline-flex; align-items: center; min-height: 2.75rem;
  font-size: 0.875rem; font-weight: 500; letter-spacing: 0.025em; color: var(--ink);
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 4px;
}

/* Services */
.services { max-width: 64rem; margin: 0 auto; padding: 0 1.5rem 4rem; }
.services h2 {
  margin-bottom: 2rem; text-align: center; font-size: 1.75rem; color: var(--orange); font-weight: 600;
}
.cards { display: grid; gap: 1rem; }
.card {
  display: flex; min-height: 11rem; align-items: center; justify-content: center;
  padding: 1.5rem; border: 1px solid var(--orange); border-radius: 10px;
  background: var(--paper);
}
.card p { text-align: center; font-size: 0.95rem; line-height: 1.6; color: var(--orange-deep); }
.strong { font-weight: 600; color: var(--orange-deep); display: block; margin-bottom: 0.4rem; font-size: 1.1rem; }

/* Footer */
footer {
  padding: 2.5rem 1.5rem 4rem; text-align: center; border-top: 1px solid var(--line); background: var(--paper);
}
.footer-info { display: flex; flex-direction: column; gap: 0.75rem; align-items: center; justify-content: center; }
.company-name { font-weight: 600; color: var(--ink); font-size: 0.95rem; }
.num { font-variant-numeric: tabular-nums; }
.privacy-link {
  display: inline-flex; align-items: center; min-height: 2.75rem; margin-top: 0.25rem;
  font-size: 0.875rem; font-weight: 500; letter-spacing: 0.025em; color: var(--ink);
  text-decoration: underline; text-underline-offset: 4px; transition: color 0.2s;
}
.privacy-link:hover { color: var(--orange-deep); }

/* Responsive */
@media (min-width: 640px) {
  .poem p { font-size: 2rem; }
  .poem .intro { font-size: 1.1rem; }
  .badges { flex-direction: row; }
  .fact { position: relative; padding: 2.25rem 0; }
  .fact h2 { position: absolute; top: 50%; right: 0;
