  <style>
:root {
  --paper: #fcfbfe;
  --ink: #1a0826;
  --purple-dark: #2e003e;
  --purple-main: #4a0e4e;
  --purple-light: #6a1b6e;
  --muted: #5a4b62;
  --line: #e2d7e5;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  background: var(--paper);
  color: var(--ink);
  font-family: "IBM Plex Sans Arabic", system-ui, sans-serif;
  text-wrap: pretty;
  line-height: 1.5;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

h1, h2 { text-wrap: balance; font-weight: 500; }

a:focus-visible { outline: 2px solid var(--purple-main); outline-offset: 3px; }

main { min-height: 100vh; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }

/* Banners */
.banner { position: relative; isolation: isolate; overflow: hidden; background: var(--purple-dark); }
.overlay-purple { position: absolute; inset: 0; background: var(--purple-dark); opacity: 0.9; }

.hero { height: 16rem; }
.banner-content {
  position: relative; display: flex; height: 100%;
  align-items: center; justify-content: center; padding: 0 1.5rem;
}
.hero-title {
  text-align: center; font-size: 2rem; letter-spacing: 0.025em; color: #ffffff; font-weight: 700;
}

/* Poem */
.poem { padding: 3.5rem 1.5rem; }
.poem p {
  max-width: 48rem; margin: 0 auto; text-align: center;
  font-size: 1.35rem; font-weight: 600; line-height: 1.625; color: var(--purple-dark);
}

/* Tagline */
.tagline-grid {
  position: relative; display: grid; gap: 2rem; padding: 3.5rem 1.5rem; background: var(--purple-dark);
}
.tagline-ar, .tagline-en {
  font-size: 1.35rem; font-weight: 600; color: #ffffff; text-align: center;
}
.tagline-ar { line-height: 1.4; }
.tagline-en { line-height: 1.3; text-transform: uppercase; letter-spacing: 0.025em; }

/* Coming soon */
.soon { padding: 3.5rem 1.5rem; text-align: center; }
.soon h2 { font-size: 1.5rem; font-weight: 700; color: var(--purple-dark); }
